name: Validate collection

on:
  push:
    paths:
      - "collection/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "collection/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/validate.py
