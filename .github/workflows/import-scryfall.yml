name: Import collection from Scryfall

on:
  push:
    paths:
      - "collection/import.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import cards from Scryfall
        env:
          IMPORT_FILE: collection/import.txt
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          root = Path(".")
          cards_path = root / "collection/cards.json"
          names_path = root / "collection/import.txt"

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Magic-collection/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def lookup(name):
              # First try the multilingual name exactly as supplied.
              queries = [
                  f'!"{name}"',
                  f'lang:fr !"{name}"',
              ]
              for q in queries:
                  url = "https://api.scryfall.com/cards/search?" + urllib.parse.urlencode({
                      "q": q, "unique": "cards"
                  })
                  try:
                      data = get_json(url)
                      if data.get("data"):
                          return data["data"][0]
                  except Exception:
                      pass
              # Finally use the named endpoint; useful when the supplied name is English.
              url = "https://api.scryfall.com/cards/named?" + urllib.parse.urlencode({"exact": name})
              try:
                  return get_json(url)
              except Exception as exc:
                  raise RuntimeError(f"Scryfall lookup failed for {name!r}: {exc}")

          def face_data(face):
              keys = ("name","mana_cost","type_line","oracle_text","colors",
                      "power","toughness","loyalty","defense")
              return {k: face[k] for k in keys if k in face}

          def normalize(card):
              out = {
                  "oracle_id": card["oracle_id"],
                  "name": card["name"],
                  "scryfall_uri": card["scryfall_uri"],
                  "mana_cost": card.get("mana_cost", ""),
                  "cmc": card.get("cmc", 0),
                  "type_line": card.get("type_line", ""),
                  "colors": card.get("colors", []),
                  "color_identity": card.get("color_identity", []),
                  "oracle_text": card.get("oracle_text", ""),
                  "keywords": card.get("keywords", []),
                  "legalities": card.get("legalities", {}),
                  "owned": True,
              }
              for key in ("power","toughness","loyalty","defense","produced_mana"):
                  if key in card:
                      out[key] = card[key]
              if card.get("card_faces"):
                  out["card_faces"] = [face_data(f) for f in card["card_faces"]]
              return out

          data = json.loads(cards_path.read_text(encoding="utf-8"))
          cards = {c["oracle_id"]: c for c in data.get("cards", [])}
          failures = []

          for raw in names_path.read_text(encoding="utf-8").splitlines():
              name = raw.strip()
              if not name:
                  continue
              try:
                  card = normalize(lookup(name))
                  cards[card["oracle_id"]] = card
                  print("OK:", name, "->", card["name"])
              except Exception as exc:
                  failures.append({"input": name, "error": str(exc)})
                  print("FAILED:", name, exc)
              time.sleep(0.1)

          data["cards"] = sorted(cards.values(), key=lambda c: c["name"].casefold())
          cards_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          if failures:
              (root / "collection/import-failures.json").write_text(
                  json.dumps(failures, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              raise SystemExit(f"{len(failures)} card(s) could not be resolved")
          PY

      - name: Validate
        run: python3 scripts/validate.py

      - name: Commit generated collection
        run: |
          rm -f collection/import-failures.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection/cards.json collection/import.txt
          git commit -m "Import purchased Magic cards from Scryfall" || exit 0
          git push
